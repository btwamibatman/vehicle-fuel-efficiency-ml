name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-endterm.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-endterm.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Run test suite
        run: |
          mkdir -p test-results
          python -m pytest -q --strict-config --strict-markers --junitxml=test-results/pytest.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/
          retention-days: 7
